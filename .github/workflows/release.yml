name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Strip
        run: strip build/shadowtls
      - uses: actions/upload-artifact@v4
        with:
          name: shadowtls-${{ matrix.target }}
          path: build/shadowtls

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          mkdir -p out
          for d in shadowtls-*; do
            [ -f "$d/shadowtls" ] && cp "$d/shadowtls" "out/$d"
          done
          ls -la out/
      - uses: softprops/action-gh-release@v1
        with:
          files: out/*
          draft: false
          generate_release_notes: true
